volumes:
  torrent-downloads:
  radarr-config:
  sonarr-config:
  prowlarr-config:
  lidarr-config:
  explo-config:
  audiobookshelf-config:
  qbittorrent-config:
  plex-database:
  plex-xcode:

networks:
  media:
    external: true
  proxiable:
    external: true
