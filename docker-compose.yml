name: media-stack
services:
  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest
    container_name: decluttarr
    restart: always
    networks:
      - media
    environment:
      TZ: America/New_York
      PUID: 1000
      PGID: 1000
      # --- Instances ---
      SONARR: >
        - base_url: "http://${SONARR_STATIC_CONTAINER_IP}:8989"
          api_key: "$SONARR_0_API_KEY"
      RADARR: >
        - base_url: "http://${RADARR_STATIC_CONTAINER_IP}:7878"
          api_key: "$RADARR_0_API_KEY"
      LIDARR: >
        - base_url: "http://${LIDARR_STATIC_CONTAINER_IP}:8686"
          api_key: "$LIDARR_0_API_KEY"
      # --- Download Clients ---
      QBITTORRENT: >
        - base_url: "http://vpn:5080"
          username: "$QBIT_USERNAME"
          password: "$QBIT_PASSWORD"
      SABNZBD: >
        - base_url: "http://${SABNZBD_STATIC_CONTAINER_IP}:6565"
          api_key: "$SABNZBD_0_API_KEY"
      # --- Global Settings ---
      LOG_LEVEL: INFO
      TEST_RUN: False
      TIMER: 10
      REMOVE_BAD_FILES: True
      REMOVE_FAILED_DOWNLOADS: True
      REMOVE_FAILED_IMPORTS: True
      REMOVE_METADATA_MISSING: True
      REMOVE_MISSING_FILES: True
      REMOVE_ORPHANS: True
      REMOVE_SLOW: True
      REMOVE_STALLED: True
      REMOVE_UNMONITORED: True
      SEARCH_UNMET_CUTOFF: True
      SEARCH_MISSING: True
      DETECT_DELETIONS: True
    volumes:
      #- ./decluttarr/config.yaml:/app/config/config.yaml
      - ./decluttarr/logs:/app/logs
      - /tdas/media/media-stack/downloads:/downloads

  explo:
    container_name: explo
    image: ghcr.io/lumepart/explo:dev
    extra_hosts:
      - "plex.local:host-gateway"
    networks:
      - media
    ports:
      - 7288:7288
    labels:
      - web-indexer.name=Explo
    environment:
      - TZ=America/New_York
      - PUID=1000
      - PGID=1000
      - UI_USERNAME=${EXPLO_UI_USERNAME}
      - UI_PASSWORD=${EXPLO_UI_PASSWORD}
      - LIDARR_URL=http://${LIDARR_STATIC_CONTAINER_IP}:8686
      - LIDARR_API_KEY=${LIDARR_0_API_KEY}
      #- WEB_UI=true
    volumes:
      - ./explo/.env:/opt/explo/.env
      - ./explo/config:/opt/explo/config
      - /tdas/media/media-stack/downloads:/data/
      - /tdas/media/media-stack/downloads/slskd_downloads:/slskd
    restart: unless-stopped

  lidarr:
    container_name: lidarr
    image: ghcr.io/hotio/lidarr:pr-plugins
    networks:
      media:
        ipv4_address: ${LIDARR_STATIC_CONTAINER_IP}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./lidarr:/config
      - /tdas/media/media-stack/downloads:/downloads
    ports:
      - 8686:8686
    labels:
      - web-indexer.name=Lidarr
    restart: unless-stopped

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    user: 1000:1000
    volumes:
      - ./maintainerr:/opt/data
    networks:
      - media
      - proxiable
    environment:
      - TZ=America/New_York
#      - BASE_PATH=/maintainerr # uncomment if you're serving maintainerr from a subdirectory
#      - UI_HOSTNAME=:: # uncomment if you want to listen on IPv6 instead (default 0.0.0.0)
#      - UI_PORT=6247 # uncomment to change the UI port (default 6246)
#      - GITHUB_TOKEN=ghp_yourtoken # Optional: GitHub Personal Access Token for higher API rate limits (60/hr without, 5000/hr with token)
    ports:
      - 6246:6246
    labels:
      - web-indexer.name=Maintainerr
    restart: unless-stopped

